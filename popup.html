<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: white;
      color: #333;
    }
    
    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background: #202124;
        color: #e8eaed;
      }
    }
    
    .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    /* Toggle switch */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider {
      background: #4285f4;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    
    /* Dark mode toggle colors */
    @media (prefers-color-scheme: dark) {
      .slider {
        background: #5f6368;
      }
      input:checked + .slider {
        background: #8ab4f8;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <span>Block AI Overview</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
